<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة التحكم - My Little Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Cairo:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--p:#603480;--c:#FB516A;--bg:#FEF9F6;--t:#4a3a58;--l:#f0e8f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:'Cairo',sans-serif;overflow-x:hidden}
header{background:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(96,52,128,.06)}
.logo{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;line-height:1;font-size:26px;color:var(--p);white-space:nowrap;direction:ltr}
.logo b{color:var(--c);font-weight:800}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.hero{position:relative;text-align:center;padding:36px 16px 44px;background:linear-gradient(#f3e8fa,#FEF9F6);overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;opacity:.55}
.hero:before{width:150px;height:150px;background:#fbd3da;top:-50px;left:-40px}
.hero:after{width:110px;height:110px;background:#e6d6f3;bottom:-30px;right:-20px}
.hero h1{position:relative;font-family:'Baloo Bhaijaan 2','Cairo';font-weight:800;color:var(--p);font-size:29px;line-height:1.3;margin:0 0 8px}
.hero h1 span{color:var(--c)}
.hero p{position:relative;margin:0;font-size:17px;color:#7a6a88}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:-22px 0 28px;position:relative}
.tile{border-radius:24px;padding:20px 12px;text-align:center;color:#fff;text-decoration:none;font-family:'Baloo Bhaijaan 2','Cairo';font-weight:700;font-size:22px;box-shadow:0 8px 22px rgba(96,52,128,.16);transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile svg{display:block;margin:0 auto 6px}
.t1{background:var(--c)}.t2{background:var(--p)}
h2{font-family:'Baloo Bhaijaan 2','Cairo';color:var(--p);font-size:24px;margin:8px 4px 14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding-bottom:40px}
.card{background:#fff;border-radius:22px;padding:12px;text-decoration:none;color:inherit;box-shadow:0 4px 16px rgba(96,52,128,.09);display:block;transition:transform .15s}
.card:active{transform:scale(.97)}
.th{height:96px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.v .th{background:linear-gradient(135deg,#e6d6f3,#fbd3da)}
.a .th{background:#fde7ea}
.card .n{font-weight:600;font-size:15px;text-align:center}
.card .k{display:block;text-align:center;font-size:12px;color:#9a8aa8;margin-top:2px}
footer{text-align:center;color:#a99bb6;font-size:13px;padding:24px 0 34px}
.folders{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:6px 0 44px}
.fold{background:#fff;border-radius:24px;padding:18px 10px;text-align:center;text-decoration:none;color:var(--p);font-family:'Baloo Bhaijaan 2','Cairo';font-weight:700;font-size:19px;box-shadow:0 4px 16px rgba(96,52,128,.09);transition:transform .15s}
.fold:active{transform:scale(.97)}
.fold svg{display:block;margin:0 auto 6px}
.back{display:inline-block;margin:6px 0 4px;color:var(--c);font-weight:600;text-decoration:none;cursor:pointer}
.item{background:#fff;border-radius:22px;padding:14px;margin-bottom:16px;box-shadow:0 4px 16px rgba(96,52,128,.09)}
.item h3{margin:0 0 10px;font-family:'Baloo Bhaijaan 2','Cairo';color:var(--p);font-size:19px}
.item video,.item audio,.item img{width:100%;border-radius:14px;display:block}.item video{background:#000}
.empty{text-align:center;color:#9a8aa8;padding:40px 10px}
.hide{display:none}
@media(min-width:700px){.folders{grid-template-columns:repeat(5,1fr)}}
@media(min-width:700px){.hero h1{font-size:44px}}

.hide{display:none!important}
.hero{padding:26px 16px 30px}.hero h1{font-size:26px!important}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.bar .sp{flex:1}
.b{border:0;border-radius:24px;padding:9px 20px;font:600 15px 'Cairo';cursor:pointer;background:var(--c);color:#fff}
.b.s{background:var(--l);color:var(--p)}.b.sm{padding:5px 12px;font-size:13px}
.row{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:10px;box-shadow:0 3px 12px rgba(96,52,128,.08)}
.row.drag{opacity:.4}.row .nm{flex:1;font-weight:600;word-break:break-word}.row .tp{font-size:12px;color:#9a8aa8}
.row .ar{background:var(--l);color:var(--p);border:0;border-radius:10px;width:32px;height:32px;cursor:pointer;font-size:16px}
.hnd{cursor:grab;color:#b9a9c8;font-size:20px;user-select:none}
.prog{height:10px;background:var(--l);border-radius:8px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:var(--c);width:0}
.up{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:14px}
input[type=text],input[type=email],input[type=password]{width:100%;padding:11px 14px;border:2px solid var(--l);border-radius:14px;font:16px 'Cairo';margin:6px 0;direction:ltr;text-align:right}
.login{max-width:360px;margin:50px auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 3px 14px rgba(96,52,128,.1)}
.err{color:#c0392b;font-size:14px;min-height:20px}

.dlg{position:fixed;inset:0;background:rgba(40,20,60,.45);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px}
.dlg .bx{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.25);text-align:center}
.dlg h3{margin:0 0 14px;color:var(--p);font-size:18px;line-height:1.5}
.dlg input{width:100%;box-sizing:border-box;padding:12px;border:2px solid var(--l);border-radius:14px;font:inherit;font-size:16px;margin-bottom:14px;text-align:right}
.dlg .bs{display:flex;gap:10px;justify-content:center}
.dlg button{font:inherit;border:0;border-radius:999px;padding:10px 24px;cursor:pointer;background:var(--l);color:var(--p)}
.dlg button.ok{background:var(--c);color:#fff}
.toast{position:fixed;left:12px;right:12px;bottom:16px;background:#c0392b;color:#fff;border-radius:16px;padding:12px 16px;z-index:120;font-size:15px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.3);text-align:right}
.toast.okk{background:#2e8b57}
</style>
</head>
<body>
<script src="config.js"></script>
<header><div class="logo">My Little <b>Reader</b></div></header>
<section class="hero"><h1 id="title">لوحة التحكم</h1></section>

<div id="login" class="login hide">
  <input type="email" id="em" placeholder="الإيميل" autocomplete="username">
  <input type="password" id="pw" placeholder="كلمة السر" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button class="b" id="lbtn" style="width:100%">دخول</button>
</div>

<div class="wrap hide" id="app">
  <div class="bar">
    <a class="back hide" id="backLink" href="#" style="margin:0">&rarr; رجوع</a><span class="sp"></span>
    <button class="b s hide" id="newFolder">+ مجلد</button>
    <button class="b" id="upBtn">رفع ملف</button>
    <input type="file" id="file" multiple class="hide">
  </div>
  <div id="ups"></div>
  <div id="home" class="folders"></div>
  <div id="list"></div>
  <div class="empty hide" id="empty">لسه فاضي. اضغط "+ مجلد" أو "رفع ملف".</div>
  <div style="text-align:center;padding:10px 0 40px"><button class="b s sm" id="out">خروج</button></div>
</div>

<script type="module">
const $=s=>document.querySelector(s);
const CONFIG=window.APP_CONFIG||{};
const _bad=v=>!v||/PASTE|^\s*$/.test(String(v));
const _fb=CONFIG.firebase||{};
if(!window.APP_CONFIG||_bad(_fb.apiKey)||_bad(_fb.projectId)||_bad(_fb.appId)||_bad((CONFIG.cloudinary||{}).cloudName)||_bad((CONFIG.cloudinary||{}).uploadPreset)){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:#FEF9F6;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;direction:rtl;font:600 18px/1.9 Cairo,sans-serif;color:#603480';
  d.textContent='إعدادات الموقع ناقصة. افتح ملف config.js وحط فيه قيم Firebase و Cloudinary الصحيحة بدل PASTE_...، وتأكد إن config.js مرفوع جنب الصفحة بنفس المجلد.';
  document.body.appendChild(d);
  await new Promise(()=>{});
}
const fb=CONFIG.firebase, cl=CONFIG.cloudinary;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON='<svg width="64" height="64" viewBox="0 0 24 24" fill="#FB516A"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8z"/></svg>';
const TYPE={video:'فيديو',audio:'صوت',image:'صورة',file:'ملف'};
let items=[], store;

{
  const A=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const F=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  const U=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
  const app=A.initializeApp(fb), db=F.getFirestore(app), au=U.getAuth(app), col=F.collection(db,'items');
  store={
    watch:(cb,eb)=>F.onSnapshot(col,s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),eb),
    add:o=>F.addDoc(col,{...o,createdAt:Date.now()}),
    upd:(id,p)=>F.updateDoc(F.doc(db,'items',id),p),
    del:id=>F.deleteDoc(F.doc(db,'items',id)),
    login:(e,p)=>U.signInWithEmailAndPassword(au,e,p),
    logout:()=>U.signOut(au),
    onAuth:cb=>U.onAuthStateChanged(au,cb)
  };
}

$('#lbtn').onclick=async()=>{$('#lerr').textContent='';try{await store.login($('#em').value.trim(),$('#pw').value)}catch(e){$('#lerr').textContent='الإيميل أو كلمة السر غلط'}};
$('#out').onclick=()=>store.logout();

const cur=()=>{const m=location.hash.match(/^#f([\w-]+)$/);return m?m[1]:'root'};
const sortF=(a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ar',{numeric:true,sensitivity:'base'});
const foldersL=()=>items.filter(x=>x.type==='folder').sort(sortF);
const inFolder=n=>items.filter(x=>x.type!=='folder'&&(x.folder||'root')===n).sort(sortF);
function render(){
  let n=cur();
  if(n!=='root'&&!items.find(x=>x.id===n&&x.type==='folder')&&items.length){n='root';}
  const f=items.find(x=>x.id===n&&x.type==='folder');
  const root=n==='root';
  $('#backLink').classList.toggle('hide',root);$('#newFolder').classList.toggle('hide',!root);
  $('#title').textContent=root?'لوحة التحكم':(f?f.name:'...');
  const fl=root?foldersL():[];
  $('#home').innerHTML=fl.map(x=>`<div class="fold" style="position:relative;cursor:pointer" data-open="${x.id}">${ICON}${esc(x.name)}<div style="margin-top:8px"><button class="b s sm" data-fa="rn" data-id="${x.id}">اسم</button> <button class="b s sm" data-fa="del" data-id="${x.id}">حذف</button></div></div>`).join('');
  const list=inFolder(n);
  $('#list').innerHTML=list.map(x=>`<div class="row" data-id="${x.id}"><div class="nm">${esc(x.name||'')}<div class="tp">${TYPE[x.type]||'ملف'}</div></div><button class="b s sm" data-a="rn" data-id="${x.id}">اسم</button><button class="b s sm" data-a="del" data-id="${x.id}">حذف</button></div>`).join('');
  $('#empty').classList.toggle('hide',fl.length+list.length>0);
}

function errAr(e){const c=(e&&e.code)||'',m=(e&&e.message)||'';
  if(c.includes('permission-denied'))return 'مفيش صلاحية كتابة في Firestore. لازم تضيف القاعدة: match /items/{id} { allow read: if true; allow write: if request.auth != null; } في Firebase > Firestore Database > Rules وتضغط Publish، وتتأكد إنك داخل بالإيميل.';
  if(c.includes('unauthenticated'))return 'لازم تسجل دخول الأول.';
  if(c.includes('unavailable')||c.includes('network'))return 'مفيش اتصال بالنت أو Firebase.';
  if(c.includes('failed-precondition'))return 'Firestore Database مش متفعلة في المشروع (Build > Firestore Database > Create database).';
  return 'حصلت مشكلة: '+(c||m||'غير معروفة');}
function toast(t,ok){const d=document.createElement('div');d.className='toast'+(ok?' okk':'');d.textContent=t;d.onclick=()=>d.remove();document.body.appendChild(d);setTimeout(()=>d.remove(),ok?2500:14000)}
const run=async p=>{try{await p;return true}catch(e){console.error(e);toast(errAr(e));return false}};

function dlg(title,withInput,def,okText){return new Promise(res=>{
  const d=document.createElement('div');d.className='dlg';
  d.innerHTML='<div class="bx"><h3></h3>'+(withInput?'<input type="text">':'')+'<div class="bs"><button class="ok">'+okText+'</button><button class="no">إلغاء</button></div></div>';
  d.querySelector('h3').textContent=title;
  const inp=d.querySelector('input');if(inp)inp.value=def||'';
  const done=v=>{d.remove();res(v)};
  d.querySelector('.ok').onclick=()=>done(withInput?inp.value:true);
  d.querySelector('.no').onclick=()=>done(withInput?null:false);
  d.onclick=e=>{if(e.target===d)done(withInput?null:false)};
  d.onkeydown=e=>{if(e.key==='Enter')d.querySelector('.ok').click();if(e.key==='Escape')d.querySelector('.no').click()};
  document.body.appendChild(d);if(inp){inp.focus();inp.select()}else d.querySelector('.ok').focus();
})}
const askName=(t,def)=>dlg(t,true,def,'تمام');
const askYes=t=>dlg(t,false,'','حذف');
addEventListener('hashchange',render);
$('#newFolder').onclick=async()=>{const v=await askName('اسم المجلد','');if(v&&v.trim()){if(await run(store.add({type:'folder',name:v.trim(),folder:'root'})))toast('اتعمل المجلد',1)}};
$('#home').onclick=async e=>{
  const b=e.target.closest('[data-fa]');
  if(b){e.stopPropagation();const fo=items.find(x=>x.id===b.dataset.id);
    if(b.dataset.fa==='rn'){const v=await askName('الاسم الجديد',fo.name);if(v&&v.trim())await run(store.upd(fo.id,{name:v.trim()}))}
    if(b.dataset.fa==='del'){const kids=items.filter(x=>x.folder===fo.id);
      if(await askYes('حذف المجلد "'+fo.name+'"'+(kids.length?' وكل اللي جواه ('+kids.length+' ملف)':'')+' من الموقع؟ (الملفات بتفضل في Cloudinary)')){await run((async()=>{for(const k of kids)await store.del(k.id);await store.del(fo.id)})())}}
    return}
  const o=e.target.closest('[data-open]');if(o)location.hash='f'+o.dataset.open;
};

$('#list').onclick=async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const n=cur(),list=inFolder(n),i=list.findIndex(x=>x.id===b.dataset.id),a=b.dataset.a;
  if(a==='rn'){const v=await askName('الاسم الجديد',list[i].name);if(v&&v.trim())await run(store.upd(list[i].id,{name:v.trim()}))}
  if(a==='del'&&await askYes('حذف "'+list[i].name+'" من الموقع؟ (الملف نفسه بيفضل في Cloudinary)'))await run(store.del(list[i].id))
};
/* سحب وإفلات (للكمبيوتر). على الموبايل استخدم الأسهم */

$('#upBtn').onclick=()=>$('#file').click();
$('#file').onchange=e=>{[...e.target.files].forEach(upload);e.target.value=''};
function kind(f){const t=f.type||'';return t.startsWith('video')?'video':t.startsWith('audio')?'audio':t.startsWith('image')?'image':'file'}
function upload(f){
  const n=cur(),type=kind(f),name=f.name.replace(/\.[^.]+$/,'');
  const row=document.createElement('div');row.className='up';
  row.innerHTML=`${esc(f.name)}<div class="prog"><i></i></div><span class="st">جاري الرفع...</span>`;
  $('#ups').appendChild(row);const bar=row.querySelector('i'),st=row.querySelector('.st');
  const x=new XMLHttpRequest();x.open('POST',`https://api.cloudinary.com/v1_1/${cl.cloudName}/auto/upload`);
  x.upload.onprogress=e=>{if(e.lengthComputable)bar.style.width=(e.loaded/e.total*100)+'%'};
  x.onload=async()=>{try{const r=JSON.parse(x.responseText);if(!r.secure_url)throw new Error(r.error&&r.error.message||'');await store.add({folder:n,name,type,url:r.secure_url});row.remove()}catch(err){st.textContent=err.code?'اترفع على Cloudinary بس فشل الحفظ في الموقع. '+errAr(err):'فشل الرفع: '+(err.message||'تأكد من الإعدادات أو حجم الملف');st.style.color='#c0392b'}};
  x.onerror=()=>{st.textContent='فشل الرفع (النت)';st.style.color='#c0392b'};
  const fd=new FormData();fd.append('file',f);fd.append('upload_preset',cl.uploadPreset);x.send(fd);
}
render();
store.onAuth(u=>{
  $('#login').classList.toggle('hide',!!u);$('#app').classList.toggle('hide',!u);
  if(u&&!window._w){window._w=1;store.watch(d=>{items=d;render()},e=>toast(errAr(e)))}
});
</script>
</body>
</html>
