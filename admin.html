<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<style>
:root{--p:#603480;--c:#FB516A}*{box-sizing:border-box;margin:0}
body{background:#FEF9F6;font-family:Cairo,sans-serif;color:#2b2233;line-height:1.7;min-height:100vh}
h2,.fun{font-family:'Baloo Bhaijaan 2',Cairo,sans-serif;font-weight:800;color:var(--p)}
button{font:inherit;cursor:pointer;border:0}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header{background:#fff;box-shadow:0 2px 12px rgba(96,52,128,.1);padding:10px 5vw;display:flex;align-items:center;gap:12px}
header img{width:46px;height:46px;border-radius:12px}.brand{font-size:1.3rem;color:var(--p)}
.tag{border-inline-start:2px solid #d9cbe6;padding-inline-start:12px;color:var(--p);font-size:1.1rem;flex:1}
.btn{background:var(--c);color:#fff;border-radius:14px;padding:11px 22px;font-weight:600;display:block;width:100%;margin-top:16px}
.out{background:transparent;color:var(--c);border:2px solid var(--c)}.sm{width:auto;margin:0;padding:7px 14px}
main{padding:28px 5vw 70px}.card{background:#fff;border-radius:20px;box-shadow:0 6px 20px rgba(96,52,128,.12);padding:20px;max-width:640px;margin:0 auto 14px;position:relative}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:20px}.tabs button{padding:10px 22px;border-radius:12px;background:#fff;color:var(--p);font-weight:700}.tabs .on{background:var(--c);color:#fff}
label{display:block;font-weight:700;color:var(--p);margin:14px 0 6px}
input,textarea{width:100%;border:1.5px solid #e4d8ee;border-radius:12px;padding:11px;font:inherit;background:#FEF9F6}
.row{display:flex;align-items:center;gap:12px}.row img{width:56px;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#eee}.grow{flex:1}
.pr{color:var(--c);font-weight:800}.del{background:none;color:var(--c)}
.shr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0}.shr input{width:110px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}.modal .card{max-height:90vh;overflow:auto;width:100%;margin:0}
.od{position:absolute;top:12px;left:12px;background:none;color:var(--c);font-weight:700}
.gl{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.gi{position:relative;width:72px;height:72px;border-radius:10px;cursor:grab;touch-action:none}.gi img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}.gi.dg{opacity:.4}.gi.ov{outline:3px dashed var(--c)}.gx{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:16px;line-height:20px;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.muted{color:#6b5a7a}.ol{white-space:pre-line}
</style></head><body>

<script>
firebase.initializeApp(FB_CONFIG);var db=firebase.firestore(),au=firebase.auth(),$=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
var ST={tab:"p",prod:[],ord:[],ship:[],set:{},m:null};
function np(s){s=String(s).replace(/\D/g,"");return s.charAt(0)=="0"?"20"+s.slice(1):s}
au.onAuthStateChanged(function(u){u?load():login()});
function login(){$("m").innerHTML='<div class="card"><h2>تسجيل الدخول</h2><label>الإيميل</label><input id="em" type="email"><label>كلمة المرور</label><input id="pw" type="password"><button class="btn" id="lg">دخول</button></div>';
 $("lg").onclick=function(){au.signInWithEmailAndPassword($("em").value.trim(),$("pw").value).catch(function(){alert("بيانات الدخول غلط")})}}
var DS=[["القاهرة","Cairo",65],["الجيزة","Giza",65],["القليوبية","Qalyubia",65],["الإسكندرية","Alexandria",70],["بورسعيد","Port Said",80],["السويس","Suez",80],["الإسماعيلية","Ismailia",80],["دمياط","Damietta",80],["الدقهلية","Dakahlia",75],["الشرقية","Sharqia",75],["الغربية","Gharbia",75],["كفر الشيخ","Kafr El Sheikh",75],["المنوفية","Monufia",75],["البحيرة","Beheira",75],["الفيوم","Fayoum",80],["بني سويف","Beni Suef",80],["المنيا","Minya",85],["أسيوط","Asyut",90],["سوهاج","Sohag",90],["قنا","Qena",95],["الأقصر","Luxor",95],["أسوان","Aswan",100],["البحر الأحمر","Red Sea",100],["الوادي الجديد","New Valley",120],["مطروح","Matrouh",100],["شمال سيناء","North Sinai",120],["جنوب سيناء","South Sinai",110]];
async function seed(){
 var b=db.batch(),n=["المستوى الأول – Short Vowels","المستوى الثاني – Long Vowels","المستوى الثالث"];
 b.set(db.doc("settings/main"),{site_name:"My Little Reader",phone:"201156617653",facebook:"https://facebook.com/"});
 n.forEach(function(x,k){b.set(db.doc("products/"+(k+1)),{id:k+1,sort:k+1,legacy:k+1,name:x,price:165,description:"",cover_url:"",gallery:[]})});
 b.set(db.doc("shipping/main"),{list:DS.map(function(x){return {ar:x[0],en:x[1],price:x[2]}})});
 await b.commit();
}
async function load(){
 try{
  var s=await db.doc("settings/main").get();
  if(!s.exists){await seed();s=await db.doc("settings/main").get()}
  var r=await Promise.all([db.collection("products").get(),db.collection("orders").orderBy("createdAt","desc").get(),db.doc("shipping/main").get()]);
  ST.set=s.data();ST.prod=r[0].docs.map(function(d){return d.data()}).sort(function(a,b){return (a.sort||0)-(b.sort||0)||a.id-b.id});
  ST.ord=r[1].docs.map(function(d){return Object.assign({id:d.id},d.data())});ST.ship=r[2].data().list;draw();
 }catch(e){alert("الحساب ده مش أدمن أو الإعدادات ناقصة: "+e.message);au.signOut()}
}
function draw(){
 var h='<div class="tabs">'+[["p","المنتجات"],["o","الطلبات"],["s","الإعدادات"]].map(function(t){return '<button data-t="'+t[0]+'" class="'+(ST.tab==t[0]?'on':'')+'">'+t[1]+'</button>'}).join("")+'</div>';
 if(ST.tab=="p"){h+=ST.prod.map(function(p){return '<div class="card row"><img src="'+esc(p.cover_url||"")+'" alt=""><div class="grow"><b>'+esc(p.name)+'</b><div class="pr">'+p.price+' ج.م</div></div><button class="btn out sm" data-e="'+p.id+'">تعديل</button><button class="del" data-d="'+p.id+'" aria-label="حذف"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div>'}).join("")+'<div style="max-width:640px;margin:auto"><button class="btn" data-n>إضافة منتج</button></div>'}
 else if(ST.tab=="o"){h+=ST.ord.length?ST.ord.map(function(o){var d=(o.createdAt&&o.createdAt.toDate?o.createdAt.toDate():new Date()).toLocaleString("ar-EG",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  return '<div class="card"><button class="od" data-od="'+o.id+'">حذف</button><b>'+d+'</b><div class="ol">'+(o.items||[]).map(function(i){return "• "+esc(i.name)+" × "+i.qty}).join("\n")+'</div><div class="ol">السعر: '+o.subtotal+' | التوصيل: '+o.shipping+' | الإجمالي: '+o.total+' جنيه مصري</div><div class="ol muted">'+esc(o.customer_name)+"\n"+esc(o.phone)+"\n"+esc(o.address)+" - "+esc(o.governorate)+'</div></div>'}).join(""):'<div class="card muted">مفيش طلبات لسه.</div>'}
 else{var s=ST.set;h+='<div class="card"><h2>الإعدادات</h2><label>اسم الموقع</label><input id="sn" value="'+esc(s.site_name)+'"><label>رقم الواتساب</label><input id="sp" value="'+esc(s.phone)+'"><label>لينك فيسبوك</label><input id="sf" value="'+esc(s.facebook)+'"><label>أسعار التوصيل</label>'+ST.ship.map(function(g,k){return '<div class="shr"><span>'+g.ar+'</span><input type="number" min="0" data-s="'+k+'" value="'+g.price+'"></div>'}).join("")+'<button class="btn" id="ss">حفظ أسعار التوصيل</button></div>'}
 var m=ST.m;if(m)h+='<div class="modal"><div class="card"><h2>'+(m.id?"تعديل منتج":"إضافة منتج")+'</h2><label>اسم المنتج</label><input id="mn" value="'+esc(m.name)+'"><label>السعر</label><input id="mp" type="number" min="0" value="'+m.price+'"><label>رفع صورة الغلاف</label><input type="file" accept="image/*" id="mc">'+(m.cover_url?'<img src="'+esc(m.cover_url)+'" width="70" style="border-radius:10px;margin-top:8px" alt="">':'')+'<label>إضافة صور المعرض ('+m.gallery.length+')</label><input type="file" accept="image/*" id="mg" multiple><div class="gl">'+m.gallery.map(function(u,k){return '<div class="gi" draggable="true" data-gi="'+k+'"><img src="'+esc(u)+'" alt="" draggable="false"><button type="button" class="gx" data-rg="'+k+'" aria-label="حذف">&times;</button></div>'}).join("")+'</div><label>الوصف</label><textarea id="md" rows="4">'+esc(m.description)+'</textarea><button class="btn" id="ms"'+(m.pend?' disabled':'')+'>'+(m.pend?'جاري الرفع...':'حفظ')+'</button><button class="btn out" id="mx">إلغاء</button></div></div>';
 $("m").innerHTML=h}
function sy(){if(ST.m&&$("mn")){ST.m.name=$("mn").value;ST.m.price=+$("mp").value||0;ST.m.description=$("md").value}}
function up(f){var C=window.CLOUDINARY_CONFIG;if(!C||!C.cloudName||!C.uploadPreset)return Promise.reject(new Error("إعدادات Cloudinary مش موجودة في config.js"));var fd=new FormData();fd.append("file",f);fd.append("upload_preset",C.uploadPreset);return fetch("https://api.cloudinary.com/v1_1/"+encodeURIComponent(C.cloudName)+"/image/upload",{method:"POST",body:fd}).then(function(r){return r.json().then(function(j){if(!r.ok||!j.secure_url)throw new Error((j.error&&j.error.message)||"فشل الرفع");return j.secure_url})})}
document.addEventListener("change",async function(e){var i=e.target.id;if(i!="mc"&&i!="mg")return;sy();var fl=Array.prototype.slice.call(e.target.files);if(!fl.length)return;var M=ST.m;if(!M)return;M.pend=(M.pend||0)+1;draw();try{for(var k=0;k<fl.length;k++){var u=await up(fl[k]);if(i=="mc")M.cover_url=u;else M.gallery.push(u)}}catch(er){alert("تعذّر رفع الصورة: "+er.message)}M.pend--;if(ST.m===M)draw()});
document.addEventListener("click",async function(e){
 var t=function(s){return e.target.closest(s)},x;
 if(x=t("[data-t]")){ST.tab=x.dataset.t;draw()}
 if(t("[data-n]")){ST.m={id:0,name:"",price:165,description:"",cover_url:"",gallery:[]};draw()}
 if(x=t("[data-e]")){var p=ST.prod.filter(function(q){return q.id==x.dataset.e})[0];ST.m={id:p.id,name:p.name,price:p.price,description:p.description||"",cover_url:p.cover_url||"",gallery:(p.gallery||[]).slice()};draw()}
 if(x=t("[data-d]")){if(confirm("حذف المنتج؟")){await db.doc("products/"+x.dataset.d).delete();load()}}
 if(x=t("[data-od]")){if(confirm("حذف الطلب؟")){await db.doc("orders/"+x.dataset.od).delete();load()}}
 if(x=t("[data-rg]")){sy();ST.m.gallery.splice(+x.dataset.rg,1);draw()}
 if(t("#mx")){ST.m=null;draw()}
 if(t("#ms")){sy();var m=ST.m;if(m.pend){alert("استنى لحد ما الصورة تخلص رفع");return}if(!m.name.trim()){alert("اكتب اسم المنتج");return}
  if((m.cover_url.length+m.gallery.join("").length)>900000){alert("الصور كبيرة قوي، قلّل عدد صور المعرض");return}
  var id=m.id||ST.prod.reduce(function(a,b){return Math.max(a,b.id)},0)+1,old=ST.prod.filter(function(q){return q.id==id})[0]||{};
  try{await db.doc("products/"+id).set({id:id,sort:old.sort||id,legacy:old.legacy||null,name:m.name,price:m.price,description:m.description,cover_url:m.cover_url,gallery:m.gallery})}catch(er){alert("تعذّر الحفظ: "+er.message);return}
  ST.m=null;load()}
 if(t("#ss")){
  try{await db.doc("settings/main").set({site_name:$("sn").value.trim(),phone:np($("sp").value),facebook:$("sf").value.trim()});
  document.querySelectorAll("[data-s]").forEach(function(i){ST.ship[+i.dataset.s].price=+i.value||0});
  await db.doc("shipping/main").set({list:ST.ship});alert("تم الحفظ");load()}catch(er){alert("تعذّر الحفظ: "+er.message)}}
});
</script><script>(function(){var src=null;function gi(e){return e.target.closest?e.target.closest(".gi"):null}
document.addEventListener("dragstart",function(e){var g=gi(e);if(!g)return;src=+g.dataset.gi;g.classList.add("dg");try{e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(src))}catch(x){}});
document.addEventListener("dragover",function(e){var g=gi(e);if(g&&src!==null){e.preventDefault();Array.prototype.forEach.call(document.querySelectorAll(".gi.ov"),function(n){n.classList.remove("ov")});g.classList.add("ov")}});
document.addEventListener("drop",function(e){var g=gi(e);if(!g||src===null)return;e.preventDefault();var to=+g.dataset.gi,from=src;src=null;if(from===to||!ST.m)return;sy();var a=ST.m.gallery,it=a.splice(from,1)[0];a.splice(to,0,it);draw()});
document.addEventListener("dragend",function(){src=null;Array.prototype.forEach.call(document.querySelectorAll(".gi"),function(n){n.classList.remove("dg","ov")})})})();</script>
